services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite+aiosqlite:////app/data/adrobot.db
      KEITARO_API_URL: ${KEITARO_API_URL:-${KEITARO_BASE_URL:-}}
      KEITARO_BASE_URL: ${KEITARO_BASE_URL:-${KEITARO_API_URL:-}}
      KEITARO_API_KEY: ${KEITARO_API_KEY:-}
      KEITARO_TIMEOUT_SECONDS: ${KEITARO_TIMEOUT_SECONDS:-15.0}
      KEITARO_DEFAULT_DOMAIN_ID: ${KEITARO_DEFAULT_DOMAIN_ID:-1813}
      KEITARO_DEFAULT_GROUP_ID: ${KEITARO_DEFAULT_GROUP_ID:-10332}
      KEITARO_DEFAULT_TRAFFIC_SOURCE_ID: ${KEITARO_DEFAULT_TRAFFIC_SOURCE_ID:-836}
      KEITARO_CAMPAIGN_PREFIX: ${KEITARO_CAMPAIGN_PREFIX:-test_bullo_}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:3000","http://localhost:5173"]}
    volumes:
      - adrobot_sqlite_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - adrobot_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - adrobot_net
    restart: unless-stopped

volumes:
  adrobot_sqlite_data:

networks:
  adrobot_net:
    driver: bridge
